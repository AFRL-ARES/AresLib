syntax = "proto3";

package ares.messaging.analyzing.input;

import "google/protobuf/any.proto";

// this one's meant for the ARES to let the analyzer know what sort of inputs it's going
// to be sending in case the analyzer wants to check if they're compatible
message AnalyzerInputDescription {
	string key = 1; // The key letting analyzer know which input this is
	string type_name = 2; // The type of the input
}